title = "SharedNet client export"
[extend]
useDefault = true

[[rules]]
id = "sharednet-capability"
description = "SharedNet bearer capability"
regex = '''\b(?:snk|sni|rit|rmt|clp|shr|afk)_[A-Za-z0-9_-]{43}\b'''

# The ported server tests use fixed UUIDs as idempotency keys and contact-rule ids, and one
# sentence that says it holds no secret; the generic rule reads those as keys. Only lines of
# exactly these shapes are allowed (a path allowlist would hide real keys in whole files).
[[allowlists]]
description = "Synthetic UUIDs and sample text in the ported server and protocol tests"
regexTarget = "line"
regexes = [
  '''"idempotency-key": "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''',
  '''const key="[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";''',
  '''"nothing secret here, i_RedactIns1 and p_RedactPr01 stay"''',
]

# This one published UUID is a fixed synthetic outbox fixture, never a credential.
# Restrict the exception to its exact line and test file; other keys stay scanned.
[[allowlists]]
description = "Fixed synthetic reply-outbox UUID fixture"
condition = "AND"
paths = ['''^packages/cli/src/reply-outbox\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*idempotency_key: "a4a3ee44-bba2-4e5b-b9ed-596dfe048352",\s*$''']

# Historical artifact provenance names api-client files next to their SHA-256s,
# which the generic API-key detector mistakes for credentials. Require both an
# exact provenance path and a complete JSON hash line; other keys and values
# in these files, and the same line in any other file, remain scanned.
[[allowlists]]
description = "SHA256 metadata for api-client artifacts in two provenance files"
condition = "AND"
paths = [
  '''^experiments/planner-quorum-client/runtime-sha256\.json$''',
  '''^experiments/planner-quorum-client/baseline-provenance\.json$''',
]
regexTarget = "line"
regexes = ['''^\s*"dist(?:/|\\\\)api-client\.(?:js|d\.ts)":\s*"[0-9a-f]{64}",?\s*$''']
